# Commanders. Spec: docs/design/04-commanders.md. Effect types: docs/design/05-combat.md section 6.
# Every array has 5 entries = value at skill level 1..5. Skill n unlocks at star n.
# `text` placeholders {1}, {2}, ... are the arrays of the skill in order of appearance.
# All figures are historical; all skill names, texts and numbers are original.
commanders:
  # ------------------------------------------------------------- LEGENDARY
  - id: hannibal
    name: "Hannibal Barca"
    title: "Terror of the Republic"
    origin: "Carthage, 247-183 BC"
    rarity: legendary
    trees: [leadership, skirmish, conquest]
    skills:
      - { id: hannibal_1, name: "Closing Jaws", kind: active,
          text: "Hits up to 3 enemies (potency {1}) and lowers the target's defense by {2}% for 3 s.",
          effects: [ { type: damage, potency: [600, 700, 800, 900, 1100], targets: 3 },
                     { type: debuff, mods: { defense_pct: [-10, -12, -14, -16, -20] }, ticks: 3 } ] }
      - { id: hannibal_2, name: "Host of Many Peoples", kind: passive,
          text: "With 3 or more troop types: attack +{1}%, defense +{2}%.",
          effects: [ { type: mods, when: mixed, mods: { attack_pct: [3, 4, 5, 6, 8], defense_pct: [3, 4, 5, 6, 8] } } ] }
      - { id: hannibal_3, name: "Over the Mountains", kind: passive,
          text: "March speed +{1}%, troop capacity +{2}%.",
          effects: [ { type: mods, when: always, mods: { march_speed_pct: [5, 7, 9, 11, 15], march_capacity_pct: [3, 4, 5, 6, 8] } } ] }
      - { id: hannibal_4, name: "Trampling Charge", kind: passive, trigger: { every_n_attacks: 6 },
          text: "Every 6th attack deals extra damage (potency {1}).",
          effects: [ { type: damage, potency: [200, 250, 300, 350, 450] } ] }

