# Talent trees. Spec: docs/design/04-commanders.md section 6.
# `mods` values are PER RANK. `requires_points` = points already spent in the same tree.
# Each tree: 6 minor nodes (3 ranks) + 2 major nodes + 1 capstone (1 rank each) = 21 points.
