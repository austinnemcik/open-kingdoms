    capacity: { base: { food: 2000, wood: 2000, stone: 2000, gold: 2000 }, growth: 1.6 }
    name: City Hall
    footprint: 4
    max_level: 25
    max_count: 1
    requires_city_hall: 0
    cost: { base: { food: 0, wood: 0, stone: 0, gold: 0 }, growth: 1.0 }
    upgrade_cost: { base: { food: 300, wood: 300, stone: 0, gold: 0 }, growth: 1.55 }
