# Building definitions. Per-level costs and times are generated from a base
# value and a growth factor: value(level) = base * growth^(level - 1).
# Costs are what it takes to reach that level; level 1 is the build cost.
# `requires_city_hall`: minimum City Hall level before this can be built.
